aid: diraq
name: Diraq
description: 'Diraq is a quantum computing company headquartered in Sydney, Australia,
  with offices in Palo Alto, California and Boston, Massachusetts. Spun out of UNSW
  Sydney in 2022 by Professor Andrew Dzurak, Diraq builds quantum processors from silicon
  spin qubits — quantum information encoded in the spin of single electrons held in
  quantum dots formed inside structures derived from conventional CMOS transistors,
  so the qubits can be fabricated on standard semiconductor foundry lines. The company
  works with imec, NVIDIA and Quantum Machines, has advanced through DARPA''s utility-scale
  quantum computing initiative, and targets a first commercial processor toward the
  end of the decade. Diraq is a pre-commercial hardware and research organization: as
  of this profile it publishes no developer program, public API, SDK, or machine-readable
  contract of any kind, and its stated commercial pathway — cloud access to its processors
  — is still on the roadmap rather than in market.'
